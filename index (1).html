<head>
  <meta charset="UTF-8" />

  <title>Zen Reader — Distraction-free web novel reading</title>
  <meta name="description" content="A mobile-first, distraction-free e-reader for web novels. Paste any chapter and read in a clean, focused Zen mode." />
  <meta name="theme-color" content="#0e1117" />
  
  <!-- Google Fonts: Lora (Serif) & Geist/Inter (Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Mobile tap optimization */
    .no-tap-highlight {
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Smooth theme transitions */
    .reader-surface {
      transition: background-color 0.35s ease, color 0.35s ease;
    }
    
    /* Starry background pattern */
    .reader-starry {
      background-image: 
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.75) 0 1px, transparent 1.5px), 
        radial-gradient(circle at 76% 32%, rgba(159,197,255,.65) 0 1px, transparent 1.5px), 
        radial-gradient(circle at 48% 72%, rgba(255,255,255,.6) 0 1px, transparent 1.5px), 
        radial-gradient(circle at 88% 84%, rgba(255,255,255,.7) 0 1px, transparent 1.5px) !important;
      background-size: 190px 220px, 260px 290px, 230px 260px, 310px 340px !important;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    // --- INDEXEDDB STORAGE (CHAPTER CACHE) ---
    const DB_NAME = 'zenreader-chapters';
    const STORE_NAME = 'chapters';
    const DB_VERSION = 1;

    function openDb() {
      if (typeof indexedDB === 'undefined') return Promise.resolve(null);
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'url' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch {
          resolve(null);
        }
      });
    }

    async function saveChapter(chapter) {
      const db = await openDb();
      if (!db) return;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(chapter);
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => { db.close(); resolve(); };
        } catch {
          db.close();
          resolve();
        }
      });
    }

    async function getChapter(url) {
      const db = await openDb();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(url);
          req.onsuccess = () => { db.close(); resolve(req.result || null); };
          req.onerror = () => { db.close(); resolve(null); };
        } catch {
          db.close();
          resolve(null);
        }
      });
    }

    // --- HELPER FUNCTIONS ---
    function processText(raw) {
      if (!raw) return { title: null, paragraphs: [], wordCount: 0 };
      const normalized = raw
        .replace(/\r\n?/g, '\n')
        .replace(/\u00a0/g, ' ')
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();

      if (!normalized) return { title: null, paragraphs: [], wordCount: 0 };

      const hasBlankLines = /\n\s*\n/.test(normalized);
      const chunks = hasBlankLines ? normalized.split(/\n\s*\n/) : normalized.split(/\n/);
      let paragraphs = chunks.map((c) => c.replace(/\n/g, ' ').trim()).filter(Boolean);

      let title = null;
      const first = paragraphs[0];
      if (first && first.length <= 80 && !/[.!?…]$/.test(first) && paragraphs.length > 1) {
        title = first;
        paragraphs = paragraphs.slice(1);
      }

      const wordCount = paragraphs.reduce((sum, p) => sum + p.split(/\s+/).filter(Boolean).length, 0);
      return { title, paragraphs, wordCount };
    }

    function buildChapterText(title, paragraphs) {
      const body = paragraphs.join('\n\n');
      return title ? `${title}\n\n${body}` : body;
    }

    // Client-side extraction engine using CORS proxy fallback
    async function extractChapter(url) {
      const NEXT_PATTERN = /(next\s*chapter|next\s*episode|next\s*part|^next$|»|›|→)/i;
      const PREV_PATTERN = /(prev(ious)?\s*chapter|prev(ious)?\s*episode|prev(ious)?\s*part|^prev(ious)?$|«|‹|←)/i;

      function findChapterLink(doc, baseUrl, pattern) {
        const anchors = Array.from(doc.querySelectorAll('a[href]'));
        for (const a of anchors) {
          const text = (a.textContent || '').trim();
          const rel = a.getAttribute('rel') || '';
          const aria = a.getAttribute('aria-label') || '';
          if (!pattern.test(text) && !pattern.test(rel) && !pattern.test(aria)) continue;
          const href = a.getAttribute('href');
          if (!href) continue;
          try {
            const resolved = new URL(href, baseUrl);
            if (resolved.protocol !== 'http:' && resolved.protocol !== 'https:') continue;
            return resolved.toString();
          } catch {
            continue;
          }
        }
        return null;
      }

      try {
        // Try direct fetch or cors proxy fallback
        let responseHtml = '';
        let finalUrl = url;

        try {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) {
            responseHtml = await res.text();
          }
        } catch {
          /* fail fallback handled below */
        }

        if (!responseHtml) {
          return { ok: false, blocked: true, message: 'Site protection detected or CORS restricted. Copy text manually to bypass.' };
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(responseHtml, 'text/html');
        
        // Remove unwanted tags
        const badElements = doc.querySelectorAll('script, style, iframe, nav, header, footer, noscript, .ad, .ads, .advertisement');
        badElements.forEach((el) => el.remove());

        const nextUrl = findChapterLink(doc, url, NEXT_PATTERN);
        const prevUrl = findChapterLink(doc, url, PREV_PATTERN);
        const pageTitle = doc.title || '';

        // Extract paragraphs from main text container or all p tags
        let paragraphs = Array.from(doc.querySelectorAll('p'))
          .map((p) => (p.textContent || '').trim())
          .filter((t) => t.length > 15);

        if (paragraphs.length === 0) {
          const bodyText = doc.body ? doc.body.textContent || '' : '';
          const proc = processText(bodyText);
          paragraphs = proc.paragraphs;
        }

        if (paragraphs.length === 0) {
          return { ok: false, blocked: false, message: 'Could not find readable chapter content on that page.' };
        }

        const extractedText = paragraphs.join('\n\n');
        const processed = processText(extractedText);
        const title = (processed.title || pageTitle || null);

        return {
          ok: true,
          title,
          paragraphs: processed.paragraphs,
          wordCount: processed.wordCount,
          prevUrl: prevUrl && prevUrl !== url ? prevUrl : null,
          nextUrl: nextUrl && nextUrl !== url ? nextUrl : null,
          sourceUrl: url,
        };
      } catch (err) {
        return { ok: false, blocked: false, message: 'Could not reach or parse that URL.' };
      }
    }

    // --- PERSISTENCE ---
    function saveState() {
      try {
        localStorage.setItem('zenreader:settings', JSON.stringify(state.settings));
        localStorage.setItem('zenreader:text', state.text);
        localStorage.setItem('zenreader:reading', state.isReading ? '1' : '0');
        if (state.chapter) {
          localStorage.setItem('zenreader:chapter', JSON.stringify(state.chapter));
        } else {
          localStorage.setItem('zenreader:chapter', '');
        }
      } catch (e) {
        /* storage full / blocked */
      }
    }

    function loadState() {
      try {
        const storedSettings = localStorage.getItem('zenreader:settings');
        if (storedSettings) {
          const parsed = JSON.parse(storedSettings);
          state.settings = { ...state.settings, ...parsed };
        }
        const storedText = localStorage.getItem('zenreader:text');
        if (storedText) state.text = storedText;

        const storedChapter = localStorage.getItem('zenreader:chapter');
        if (storedChapter) {
          try { state.chapter = JSON.parse(storedChapter); } catch {}
        }

        const storedScroll = localStorage.getItem('zenreader:scroll');
        if (storedScroll) state.initialScroll = Number(storedScroll) || 0;

        if (localStorage.getItem('zenreader:reading') === '1' && state.text.trim()) {
          state.isReading = true;
        }
      } catch (e) {}
    }

    // --- AUTO SCROLL ENGINE ---
    function startAutoScroll() {
      if (rafAutoScroll) cancelAnimationFrame(rafAutoScroll);
      let last = performance.now();
      let remainder = 0;

      const step = (now) => {
        if (!state.autoScroll) return;
        const speedObj = SCROLL_SPEEDS.find((s) => s.id === state.settings.scrollSpeed) || SCROLL_SPEEDS[1];
        const dt = (now - last) / 1000;
        last = now;
        remainder += speedObj.pxPerSecond * dt;
        const whole = Math.floor(remainder);
        if (whole >= 1) {
          window.scrollBy(0, whole);
          remainder -= whole;
        }
        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (window.scrollY >= max - 1) {
          state.autoScroll = false;
          render();
          return;
        }
        rafAutoScroll = requestAnimationFrame(step);
      };
      rafAutoScroll = requestAnimationFrame(step);
    }

    function stopAutoScroll() {
      if (rafAutoScroll) cancelAnimationFrame(rafAutoScroll);
      rafAutoScroll = null;
    }

    // --- MAIN RENDER ENGINE ---
    function render() {
      const app = document.getElementById('app');
      const theme = THEMES[state.settings.theme] || THEMES.chikari;

      // Update document root background & meta tag theme-color
      document.documentElement.style.backgroundColor = theme.bg;
      document.body.style.backgroundColor = theme.bg;
      let metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', theme.bg);

      if (state.isReading) {
        app.innerHTML = renderReaderScreen(theme);
        bindReaderEvents(theme);
      } else {
        app.innerHTML = renderInputScreen(theme);
        bindInputEvents(theme);

        const drawerOverlay = document.createElement('div');
        drawerOverlay.id = 'drawer-container';
        drawerOverlay.innerHTML = renderSettingsDrawer(theme);
        app.appendChild(drawerOverlay);
        bindSettingsDrawerEvents(theme);
      }
    }

              ${state.extractState === 'error' ? `

            <label for="chapter-text" class="mb-2 text-sm font-medium" style="color: ${theme.muted};">Chapter text</label>

            ${state.sourceLabel ? `
              <div class="mb-2 flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs" style="border-color: ${theme.border}; color: ${theme.muted};">
                ${SVG.Link2}

              ${state.text.length === 0 ? `

    function bindInputEvents(theme) {
      const urlInput = document.getElementById('chapter-url');
      if (urlInput) {
        urlInput.addEventListener('input', (e) => {
          state.urlValue = e.target.value;

          if (e.key === 'Enter') handleExtract();
        });
      }

      const btnClearUrl = document.getElementById('btn-clear-url');
      if (btnClearUrl) {
        btnClearUrl.addEventListener('click', () => {
          state.urlValue = '';
          state.extractState = 'idle';

        });

      const btnExtract = document.getElementById('btn-extract');
      if (btnExtract) {
        btnExtract.addEventListener('click', handleExtract);

      const btnSwitchManual = document.getElementById('btn-switch-manual');
      if (btnSwitchManual) {
        btnSwitchManual.addEventListener('click', () => {

          if (textarea) textarea.focus();
        });

      const textarea = document.getElementById('chapter-text');
      if (textarea) {
        textarea.addEventListener('input', (e) => {
          state.text = e.target.value;
          saveState();
          // Update character count live
          const preview = processText(state.text);
          const canRead = preview.paragraphs.length > 0;
          const btnStart = document.getElementById('btn-start-reading');
          if (btnStart) btnStart.disabled = !canRead;
        });
      }

      const btnPaste = document.getElementById('btn-paste-clipboard');
      if (btnPaste) {
        btnPaste.addEventListener('click', async () => {
          try {
            const clip = await navigator.clipboard.readText();
            if (clip) {
              state.text = clip;
              saveState();
              render();
            }
          } catch {}
        });
      }

      const btnClearText = document.getElementById('btn-clear-text');
      if (btnClearText) {
        btnClearText.addEventListener('click', () => {
          state.text = '';
          saveState();
          render();
        });
      }

      const btnStart = document.getElementById('btn-start-reading');
      if (btnStart) {
        btnStart.addEventListener('click', () => {
          const preview = processText(state.text);
          if (preview.paragraphs.length === 0) return;
          state.isReading = true;
          state.initialScroll = 0;
          saveState();
          render();
          window.scrollTo(0, 0);
        });

      const btnSample = document.getElementById('btn-sample');
      if (btnSample) {

          state.text = SAMPLE_TEXT;
          saveState();
          render();
        });

      const btnRemoveSource = document.getElementById('btn-remove-source');
      if (btnRemoveSource) {
        btnRemoveSource.addEventListener('click', () => {
          state.sourceLabel = null;
          render();
        });
      }

      const btnSettings = document.getElementById('btn-open-settings');
      if (btnSettings) {
        btnSettings.addEventListener('click', () => {
          state.settingsOpen = true;
          render();
        });
      }
    }

    async function handleExtract() {
      const url = state.urlValue.trim();
      if (!url || state.extractState === 'loading') return;

      state.extractState = 'loading';
      state.statusIndex = 0;
      state.extractMessage = '';
      render();

      statusTimer = setInterval(() => {
        state.statusIndex = Math.min(state.statusIndex + 1, STATUS_MESSAGES.length - 1);
        render();
      }, 900);

      const result = await extractChapter(url);

      if (statusTimer) clearInterval(statusTimer);

      if (result.ok) {
        const chapterText = buildChapterText(result.title, result.paragraphs);
        state.text = chapterText;
        state.chapter = { sourceUrl: result.sourceUrl, prevUrl: result.prevUrl, nextUrl: result.nextUrl };
        state.extractState = 'idle';
        state.isReading = true;
        state.initialScroll = 0;
        await saveChapter({
          url: result.sourceUrl,
          title: result.title,
          text: chapterText,
          prevUrl: result.prevUrl,
          nextUrl: result.nextUrl,
          savedAt: Date.now(),
        });
        saveState();
        render();
        window.scrollTo(0, 0);
        return;
      }

      state.extractState = result.blocked ? 'blocked' : 'error';
      state.extractMessage = result.message;
      render();
    }

    // --- READER SCREEN TEMPLATE & BINDINGS ---

            ${state.chapter && (state.chapter.prevUrl || state.chapter.nextUrl) ? `
              <nav aria-label="Chapter navigation" class="mt-10 flex items-center gap-3 border-t pt-6" style="border-color: ${theme.border}; font-family: var(--font-sans);">
                <button type="button" id="btn-prev-chapter" ${!state.chapter.prevUrl || state.navDirection !== null ? 'disabled' : ''} class="flex h-12 flex-1 items-center justify-center gap-2 rounded-xl border text-sm font-medium transition-transform active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-30" style="border-color: ${theme.border}; color: ${theme.chromeFg};">

              <span class="mt-0.5 shrink-0">${SVG.WifiOff}</span>
              <p class="flex-1">${state.navError}</p>
              <button type="button" id="btn-dismiss-nav-error" class="shrink-0 text-xs underline opacity-70">Dismiss</button>

            <div class="mx-auto flex max-w-2xl flex-col gap-4 border-t px-4 pb-[max(env(safe-area-inset-bottom),1rem)] pt-4" style="background-color: ${theme.chrome}; border-color: ${theme.border}; color: ${theme.chromeFg};">
              
              <!-- Themes -->
              <div class="flex items-center justify-between gap-3">
                <span class="text-xs font-medium uppercase tracking-wide opacity-60">Theme</span>
                <div class="flex gap-2">
                  ${THEME_ORDER.map((id) => {
                    const t = THEMES[id];
                    const active = state.settings.theme === id;
                    return `
                      <button type="button" data-theme-id="${id}" class="btn-theme-select flex items-center gap-2 rounded-full border py-1.5 pl-1.5 pr-3 text-xs font-medium transition-transform active:scale-95" style="border-color: ${active ? theme.chromeFg : theme.border}; background-color: ${active ? theme.chromeFg : 'transparent'}; color: ${active ? theme.chrome : theme.chromeFg};">
                        <span class="size-4 rounded-full border" style="background-color: ${t.swatch}; border-color: ${theme.border};"></span>

          <!-- Floating Auto-scroll Action Button -->
          <button type="button" id="btn-toggle-autoscroll" class="fixed bottom-[max(env(safe-area-inset-bottom),1.25rem)] right-4 z-30 flex items-center gap-2 rounded-full px-4 shadow-lg active:scale-95" style="height: 3.25rem; background-color: ${state.autoScroll ? theme.progress : theme.chrome}; color: ${state.autoScroll ? theme.bg : theme.chromeFg}; border: 1px solid ${theme.border}; transform: ${state.chromeVisible ? 'translateY(-4rem)' : 'translateY(0)'}; transition: transform 0.3s ease, background-color 0.2s ease;">

    function bindReaderEvents(theme) {

      if (article) {

          state.chromeVisible = !state.chromeVisible;
          render();
        });

      const btnExit = document.getElementById('btn-reader-exit');
      if (btnExit) {
        btnExit.addEventListener('click', () => {
          state.autoScroll = false;
          stopAutoScroll();
          state.isReading = false;

          render();

          render();

        btnToggleAuto.addEventListener('click', () => {
          state.autoScroll = !state.autoScroll;
          if (state.autoScroll) {
            state.chromeVisible = false;
            startAutoScroll();
          } else {
            stopAutoScroll();
          }
          render();
        });
      }

      // Font size buttons
      const btnDec = document.getElementById('btn-font-dec');
      if (btnDec) {
        btnDec.addEventListener('click', () => {
          state.settings.fontSize = Math.max(FONT_MIN, state.settings.fontSize - 1);
          saveState();
          render();
        });
      }
      const btnInc = document.getElementById('btn-font-inc');
      if (btnInc) {
        btnInc.addEventListener('click', () => {
          state.settings.fontSize = Math.min(FONT_MAX, state.settings.fontSize + 1);
          saveState();
          render();
        });
      }

      // Theme options
      document.querySelectorAll('.btn-theme-select').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const tid = e.currentTarget.getAttribute('data-theme-id');
          state.settings.theme = tid;
          saveState();
          render();
        });
      });

      // Spacing options
      document.querySelectorAll('.btn-spacing-select').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const spId = e.currentTarget.getAttribute('data-spacing-id');
          state.settings.spacing = spId;
          saveState();
          render();
        });
      });

      // Speed options
      document.querySelectorAll('.btn-speed-select').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const spdId = e.currentTarget.getAttribute('data-speed-id');
          state.settings.scrollSpeed = spdId;
          saveState();
          render();
        });
      });

      // Chapter Next/Prev buttons
      const btnPrev = document.getElementById('btn-prev-chapter');
      if (btnPrev) {
        btnPrev.addEventListener('click', () => handleChapterNavigation('prev'));
      }
      const btnNext = document.getElementById('btn-next-chapter');
      if (btnNext) {
        btnNext.addEventListener('click', () => handleChapterNavigation('next'));
      }

      const btnDismissError = document.getElementById('btn-dismiss-nav-error');
      if (btnDismissError) {
        btnDismissError.addEventListener('click', () => {
          state.navError = null;
          render();
        });
      }
    }

    async function handleChapterNavigation(dir) {
      if (!state.chapter) return;
      const targetUrl = dir === 'prev' ? state.chapter.prevUrl : state.chapter.nextUrl;
      if (!targetUrl) return;

      state.navDirection = dir;
      state.navError = null;
      render();

      try {
        const cached = await getChapter(targetUrl);
        if (cached) {
          state.text = cached.text;
          state.chapter = { sourceUrl: cached.url, prevUrl: cached.prevUrl, nextUrl: cached.nextUrl };
          saveState();
          window.scrollTo(0, 0);
          return;
        }

        const result = await extractChapter(targetUrl);
        if (!result.ok) {
          state.navError = result.blocked ? 'Site protection detected. Copy text manually to bypass.' : result.message;
          return;
        }

        const chapterText = buildChapterText(result.title, result.paragraphs);
        state.text = chapterText;
        state.chapter = { sourceUrl: result.sourceUrl, prevUrl: result.prevUrl, nextUrl: result.nextUrl };

        await saveChapter({
          url: result.sourceUrl,
          title: result.title,
          text: chapterText,
          prevUrl: result.prevUrl,
          nextUrl: result.nextUrl,
          savedAt: Date.now(),
        });
        saveState();
        window.scrollTo(0, 0);
      } finally {
        state.navDirection = null;
        render();
      }
    }

    // --- SETTINGS DRAWER TEMPLATE & BINDINGS ---
    function renderSettingsDrawer(theme) {
      return `
        <div class="fixed inset-0 z-40" role="dialog" aria-modal="true">
          <button type="button" id="btn-close-drawer-backdrop" class="absolute inset-0 bg-black/50"></button>
          <aside class="absolute right-0 top-0 flex h-full w-[min(88vw,23rem)] flex-col gap-6 overflow-y-auto border-l p-5 pt-[max(env(safe-area-inset-top),1.25rem)] shadow-2xl" style="background-color: ${theme.chrome}; color: ${theme.chromeFg}; border-color: ${theme.border};">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-xs font-semibold uppercase tracking-[.18em] opacity-60">Reader</p>
                <h2 class="mt-1 font-serif text-2xl font-semibold">Settings</h2>
              </div>
              <button type="button" id="btn-close-drawer-x" aria-label="Close settings" class="flex size-9 items-center justify-center rounded-full border" style="border-color: ${theme.border};">
                ${SVG.X}
              </button>
            </div>

            <!-- Theme Picker -->
            <section>
              <p class="mb-3 text-xs font-semibold uppercase tracking-widest opacity-60">Theme</p>
              <div class="grid grid-cols-2 gap-2">
                ${THEME_ORDER.map((id) => {
                  const t = THEMES[id];
                  const active = state.settings.theme === id;
                  return `
                    <button type="button" data-drawer-theme="${id}" class="btn-drawer-theme-select flex items-center gap-2 rounded-lg border p-2 text-left text-xs" style="border-color: ${active ? theme.accent : theme.border}; background-color: ${active ? `${theme.accent}18` : 'transparent'};">
                      <span class="size-4 rounded-full border" style="background-color: ${t.swatch}; border-color: ${theme.border};"></span>
                      ${t.label}
                    </button>
                  `;
                }).join('')}
              </div>
            </section>

            <!-- Custom Background -->
            <section>
              <p class="mb-3 text-xs font-semibold uppercase tracking-widest opacity-60">Theme customization</p>
              <label class="flex cursor-pointer items-center gap-3 rounded-lg border p-3 text-sm" style="border-color: ${theme.border};">
                ${SVG.Upload}
                <span class="flex-1">Upload custom background</span>
                <input type="file" id="file-bg-upload" accept="image/*" class="sr-only" />
              </label>
              ${state.settings.customBackground ? `
                <button type="button" id="btn-remove-bg" class="mt-2 text-xs underline opacity-70">Remove custom background</button>
              ` : ''}
              <label class="mt-5 block text-sm">
                Dark overlay <span class="float-right tabular-nums opacity-60">${state.settings.customOverlay}%</span>
                <input type="range" id="input-overlay" min="0" max="80" value="${state.settings.customOverlay}" class="mt-3 w-full accent-current" />
              </label>
            </section>

            <!-- Typography -->
            <section>
              <p class="mb-3 text-xs font-semibold uppercase tracking-widest opacity-60">Typography</p>
              <div class="flex items-center justify-between rounded-lg border p-3" style="border-color: ${theme.border};">
                <span class="text-sm">Text size</span>
                <div class="flex items-center gap-2">
                  <button type="button" id="btn-drawer-font-dec" ${state.settings.fontSize <= FONT_MIN ? 'disabled' : ''} class="flex size-8 items-center justify-center rounded-full border disabled:opacity-30" style="border-color: ${theme.border};">
                    ${SVG.Minus}
                  </button>
                  <span class="text-xs tabular-nums">${state.settings.fontSize}px</span>
                  <button type="button" id="btn-drawer-font-inc" ${state.settings.fontSize >= FONT_MAX ? 'disabled' : ''} class="flex size-8 items-center justify-center rounded-full border disabled:opacity-30" style="border-color: ${theme.border};">
                    ${SVG.Plus}
                  </button>
                </div>
              </div>
            </section>

            <!-- Spacing -->
            <section>
              <p class="mb-3 text-xs font-semibold uppercase tracking-widest opacity-60">Reading behavior</p>
              <div class="flex items-center gap-1 rounded-full border p-1" style="border-color: ${theme.border};">
                ${['tight', 'normal', 'relaxed'].map((sId) => {
                  const active = state.settings.spacing === sId;
                  return `
                    <button type="button" data-drawer-spacing="${sId}" class="btn-drawer-spacing-select flex-1 rounded-full py-1.5 text-center text-xs font-medium" style="background-color: ${active ? theme.chromeFg : 'transparent'}; color: ${active ? theme.chrome : theme.chromeFg};">
                      ${SPACING[sId].label}
                    </button>
                  `;
                }).join('')}
              </div>
            </section>
          </aside>
        </div>
      `;
    }

    function bindSettingsDrawerEvents(theme) {
      const closeFn = () => {
        state.settingsOpen = false;
        render();
      };

      const btnBackdrop = document.getElementById('btn-close-drawer-backdrop');
      if (btnBackdrop) btnBackdrop.addEventListener('click', closeFn);

      const btnX = document.getElementById('btn-close-drawer-x');
      if (btnX) btnX.addEventListener('click', closeFn);

      document.querySelectorAll('.btn-drawer-theme-select').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          state.settings.theme = e.currentTarget.getAttribute('data-drawer-theme');
          saveState();
          render();
        });
      });

      const bgUpload = document.getElementById('file-bg-upload');
      if (bgUpload) {
        bgUpload.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file || !file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = () => {
            state.settings.customBackground = typeof reader.result === 'string' ? reader.result : null;
            saveState();
            render();
          };
          reader.readAsDataURL(file);
        });
      }

      const btnRemoveBg = document.getElementById('btn-remove-bg');
      if (btnRemoveBg) {
        btnRemoveBg.addEventListener('click', () => {
          state.settings.customBackground = null;
          saveState();
          render();
        });
      }

      const inputOverlay = document.getElementById('input-overlay');
      if (inputOverlay) {
        inputOverlay.addEventListener('input', (e) => {
          state.settings.customOverlay = Number(e.target.value);
          saveState();
          render();
        });
      }

      const btnDec = document.getElementById('btn-drawer-font-dec');
      if (btnDec) {
        btnDec.addEventListener('click', () => {
          state.settings.fontSize = Math.max(FONT_MIN, state.settings.fontSize - 1);
          saveState();
          render();
        });
      }

      const btnInc = document.getElementById('btn-drawer-font-inc');
      if (btnInc) {
        btnInc.addEventListener('click', () => {
          state.settings.fontSize = Math.min(FONT_MAX, state.settings.fontSize + 1);
          saveState();
          render();
        });
      }

      document.querySelectorAll('.btn-drawer-spacing-select').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          state.settings.spacing = e.currentTarget.getAttribute('data-drawer-spacing');
          saveState();
          render();
        });
      });
    }

    // --- GLOBAL SCROLL TRACKING ---
    window.addEventListener('scroll', () => {
      if (!state.isReading) return;
      const doc = document.documentElement;
      const max = doc.scrollHeight - window.innerHeight;
      const y = window.scrollY;
      state.progress = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;

      const fill = document.getElementById('progress-bar-fill');
      if (fill) {
        fill.style.transform = `scaleX(${state.progress})`;
      }

      try {
        localStorage.setItem('zenreader:scroll', String(Math.round(y)));
      } catch {}
    }, { passive: true });

    // --- INITIALIZATION ---
    loadState();
    render();

    if (state.isReading && state.initialScroll > 0) {
      requestAnimationFrame(() => {
        window.scrollTo(0, state.initialScroll);
      });
    }
  </script>
</body>
</html>
